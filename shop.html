<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👟 Sneaker Shop | Твій стиль</title>
    <style>
        /* Базові стилі */
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
        }

        /* Шапка з фоном */
        header {
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                              url("https://images.unsplash.com/photo-1542291026-7eec264c27ff");
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        .cart-icon {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            color: black;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 1001;
        }

        /* Секція товарів */
        .products {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
        }

        /* СІТКА КАРТОК - Виправлення для ПК */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
            text-align: center;
        }

        .card:hover { transform: translateY(-10px); }

        .card img {
            width: 100%;
            height: 220px; /* Фіксована висота */
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        /* Кнопки */
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: black;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        button:hover { background: #333; }

        .btn-buy { background: #0088cc; } /* Колір для кнопки замовлення */

        /* Кошик */
        .cart-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            z-index: 2000;
        }

        .cart-modal h2 { margin-top: 0; }

        footer {
            background: black;
            color: white;
            text-align: center;
            padding: 40px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>👟 Sneaker Shop</h1>
        <p>Нові колекції 2026</p>
    </header>

    <div class="cart-icon" onclick="openCart()">
        🛒 <span id="cart-count">0</span>
    </div>

    <div id="cart-modal" class="cart-modal">
        <h2>Ваш кошик</h2>
        <div id="cart-items"></div>
        <h3 id="cart-total">Сума: 0 грн</h3>
        <button class="btn-buy" onclick="checkout()">Оформити замовлення</button>
        <button onclick="clearCart()">Очистити</button>
        <button onclick="closeCart()" style="background: #999;">Закрити</button>
    </div>

    <section class="products" id="products">
        <h2>Популярні моделі</h2>
        <div class="cards">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Nike Air">
                <h3>Nike Air Red</h3>
                <p>2999 грн</p>
                <button onclick="addToCart('Nike Air Red', 2999)">Додати в кошик</button>
                <a href="tel:+380xxxxxxxxx"><button style="background: #444;">Швидке замовлення</button></a>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1549298916-b41d501d3772" alt="Adidas Run">
                <h3>Adidas Pure Run</h3>
                <p>2799 грн</p>
                <button onclick="addToCart('Adidas Pure Run', 2799)">Додати в кошик</button>
                <a href="tel:+380xxxxxxxxx"><button style="background: #444;">Швидке замовлення</button></a>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5" alt="Puma Sport">
                <h3>Puma Sport X</h3>
                <p>2599 грн</p>
                <button onclick="addToCart('Puma Sport X', 2599)">Додати в кошик</button>
                <a href="tel:+380xxxxxxxxx"><button style="background: #444;">Швидке замовлення</button></a>
            </div>

        </div>
    </section>

    <footer id="contacts">
        <p>Контакти: 📞 +380xxxxxxxxx</p>
        <p>© 2026 Sneaker Shop </p>
    </footer>

    <script>
        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({ name, price });
            total += price;
            updateUI();
        }

        function updateUI() {
            document.getElementById("cart-count").innerText = cart.length;
        }

        function openCart() {
            let itemsHTML = "";
            cart.forEach((item, index) => {
                itemsHTML += `<p>${item.name} - ${item.price} грн 
                              <button onclick="removeItem(${index})" style="width:auto; padding:5px 10px; margin-left:10px;">❌</button></p>`;
            });

            if (cart.length === 0) itemsHTML = "<p>Кошик порожній</p>";

            document.getElementById("cart-items").innerHTML = itemsHTML;
            document.getElementById("cart-total").innerText = `Сума: ${total} грн`;
            document.getElementById("cart-modal").style.display = "block";
        }

        function closeCart() {
            document.getElementById("cart-modal").style.display = "none";
        }

        function removeItem(index) {
            total -= cart[index].price;
            cart.splice(index, 1);
            updateUI();
            openCart();
        }

        function clearCart() {
            cart = [];
            total = 0;
            updateUI();
            openCart();
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Кошик порожній!");
                return;
            }
            alert(`Замовлення прийнято! Сума: ${total} грн. Ми зв'яжемося з вами.`);
            clearCart();
            closeCart();
        }
    </script>
</body>
</html>
